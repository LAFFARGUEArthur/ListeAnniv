<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste d'anniversaire — édition Warhammer</title>
<meta name="description" content="MultiPhysxWorkbench - module selection.">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{
  --noir-abysse:#0a0908;
  --noir-basalte:#171310;
  --or-vieilli:#b8923f;
  --or-clair:#e9c977;
  --rouge-sang:#7a1c26;
  --parchemin:#e9ddc2;
  --parchemin-ombre:#cab88c;
  --encre:#2a2013;
  --texte-clair:#ddd0ae;
  --texte-attenue:#a8987a;
  --police-titres:'Cinzel', serif;
  --police-texte:'Crimson Text', serif;
  --rythme:1.6rem;
}

/* ==========================================================================
   2. RÉINITIALISATION SOBRE
   ========================================================================== */
*, *::before, *::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family:var(--police-texte);
  font-size:1.15rem;
  line-height:1.6;
  color:var(--texte-clair);
  background-color:var(--noir-abysse);
  background-image:
    linear-gradient(to bottom, rgba(10,9,8,.55), rgba(10,9,8,.85)),
    url("images/<IMAGE_FOND>");
  background-size:cover;
  background-position:center top;
  background-attachment:fixed; /* sur mobile (iOS), l'image défilera normalement : c'est normal */
}
h1,h2,h3{ font-family:var(--police-titres); font-weight:700; margin:0 0 .5em; color:var(--or-clair); }
p{ margin:0 0 1em; }
a{ color:var(--or-clair); }
img{ max-width:100%; display:block; }
button{ font-family:inherit; font-size:inherit; cursor:pointer; }

/* Accessibilité : focus clavier toujours visible */
a:focus-visible, button:focus-visible{
  outline:2px solid var(--or-clair);
  outline-offset:3px;
}

/* Lien d'évitement (accessibilité clavier) */
.lien-evitement{
  position:absolute; left:-999px; top:auto;
  background:var(--or-clair); color:var(--encre); padding:.6em 1em;
}
.lien-evitement:focus{ left:1rem; top:1rem; z-index:100; }

/* ==========================================================================
   3. STRUCTURE GÉNÉRALE — colonne unique façon manuscrit
   ========================================================================== */
.entete{
  max-width:760px; margin:0 auto; padding:4.5rem 1.5rem 2rem;
  text-align:center;
}
.titre-principal{
  font-size:clamp(2rem, 6vw, 3.4rem);
  text-transform:uppercase;
  letter-spacing:.04em;
  text-shadow:0 2px 18px rgba(0,0,0,.7);
}
.orne{
  display:block; margin:0 auto 1rem; width:2rem; height:2rem;
  color:var(--or-vieilli);
}
.sous-titre{
  font-style:italic; color:var(--texte-attenue); font-size:1.1rem;
}

.fil-ariane{
  max-width:760px; margin:0 auto; padding:0 1.5rem;
  display:flex; flex-wrap:wrap; align-items:center; gap:.4rem;
  font-size:.95rem; color:var(--texte-attenue); min-height:1.4rem;
}
.fil-ariane button{
  background:none; border:none; color:var(--or-clair);
  padding:.15rem .2rem; text-decoration:underline;
  text-underline-offset:3px;
}
.fil-ariane .separateur{ color:var(--or-vieilli); }
.fil-ariane .courant{ color:var(--texte-clair); }

.bouton-retour{
  display:inline-flex; align-items:center; gap:.4rem;
  background:transparent; border:1px solid var(--or-vieilli);
  color:var(--or-clair); padding:.5rem 1rem; margin:1rem auto 0;
}
.bouton-retour:hover{ background:rgba(184,146,63,.12); }

.panneau{
  max-width:760px; margin:1.5rem auto 4rem; padding:2.2rem 1.6rem 2.6rem;
  background:rgba(10,9,8,.82);
  border:1px solid var(--or-vieilli);
  box-shadow:0 0 0 1px rgba(233,201,119,.18) inset;
  backdrop-filter:blur(2px);
}
@media (min-width:640px){
  .panneau{ padding:2.8rem 3rem 3.2rem; }
}

.pied-page{
  max-width:760px; margin:0 auto; padding:0 1.5rem 3rem;
  text-align:center; font-style:italic; color:var(--texte-attenue);
  font-size:.95rem;
}

/* ==========================================================================
   4. TRANSITION ENTRE LES NIVEAUX DE L'ARBRE
   Un seul mouvement, sobre : un fondu + léger glissement vers le haut.
   ========================================================================== */
#zone-contenu{ opacity:0; transform:translateY(10px); }
#zone-contenu.apparition{
  animation:apparition-contenu .5s ease forwards;
}
@keyframes apparition-contenu{
  to{ opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion:reduce){
  #zone-contenu, #zone-contenu.apparition{ animation:none; opacity:1; transform:none; }
  html{ scroll-behavior:auto; }
}

/* ==========================================================================
   5. QUESTION EN COURS + TUILES DE CHOIX
   ========================================================================== */
.question-courante{ font-size:1.5rem; margin-bottom:1.4rem; }
.intro-branche{ color:var(--texte-clair); }

.liste-choix{
  list-style:none; margin:1.5rem 0 0; padding:0;
  display:flex; flex-direction:column; gap:.9rem;
}
.tuile-choix{
  width:100%; text-align:left;
  background:linear-gradient(to right, rgba(122,28,38,.14), transparent);
  border:1px solid var(--or-vieilli);
  border-left:4px solid var(--rouge-sang);
  color:var(--texte-clair);
  padding:1rem 1.2rem;
  font-family:var(--police-texte);
  font-size:1.15rem;
  transition:background .25s ease, border-color .25s ease, padding-left .25s ease;
}
.tuile-choix:hover, .tuile-choix:focus-visible{
  background:linear-gradient(to right, rgba(184,146,63,.2), transparent);
  border-left-color:var(--or-clair);
  padding-left:1.5rem;
}

/* ==========================================================================
   6. CONTENU DE FIN DE BRANCHE (feuille)
   ========================================================================== */
.clin-oeil{
  font-style:italic; color:var(--or-clair);
  border-left:2px solid var(--or-vieilli);
  padding-left:1rem; margin:1.2rem 0;
}

.citation-skaven{
  position:relative;
  margin:0 0 1.6rem; padding:1.4rem 1.6rem 1.4rem 2.4rem;
  background:rgba(122,28,38,.12);
  border:1px solid var(--or-vieilli);
  font-style:italic;
}
.citation-skaven::before{
  content:"“";
  position:absolute; left:.35rem; top:-.3rem;
  font-family:var(--police-titres);
  font-size:3rem; color:var(--or-vieilli); opacity:.6;
}
.citation-skaven cite{
  display:block; margin-top:.8rem; font-style:normal;
  color:var(--texte-attenue); font-size:.95rem;
}

.note-aparte{
  font-size:.95rem; font-style:italic; color:var(--texte-attenue);
  border-left:2px solid var(--or-vieilli); padding-left:1rem; margin-top:1.4rem;
}

/* Grille de fiches produits : 1 colonne sur mobile, jusqu'à 2 sur desktop */
.grille-produits{
  display:grid; grid-template-columns:1fr; gap:1.4rem; margin-top:1.4rem;
}
@media (min-width:560px){
  .grille-produits.produits-multiples{ grid-template-columns:1fr 1fr; }
}

.carte-produit{
  background:var(--parchemin);
  color:var(--encre);
  border:1px solid var(--or-vieilli);
  box-shadow:0 0 0 3px var(--noir-abysse), 0 0 0 4px var(--or-vieilli);
  display:flex; flex-direction:column;
}
.produit-image{
  width:100%; height:180px; object-fit:cover;
  border-bottom:1px solid var(--parchemin-ombre);
}
.produit-image.image-manquante{ object-fit:contain; background:var(--noir-basalte); }

/* Illustration insérée au fil d'un texte (voir <NOM_FICHIER.jpg> dans un "intro") */
.illustration-intro{ margin:1.4rem 0; }
.image-intro{
  width:100%; object-fit:cover;
  border:1px solid var(--or-vieilli);
  box-shadow:0 0 0 3px var(--noir-abysse), 0 0 0 4px var(--or-vieilli);
}
.image-intro.image-manquante{ object-fit:contain; background:var(--noir-basalte); }
.carte-produit .contenu-carte{
  padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; flex:1;
}
.carte-produit h3{ color:var(--encre); font-size:1.15rem; margin-bottom:.4rem; }
.carte-produit p{ font-size:1.02rem; margin-bottom:.6rem; }
.carte-produit .note-produit{
  font-size:.92rem; font-style:italic; color:#5a4c30; margin-bottom:.8rem;
}
.bouton-achat{
  margin-top:auto; align-self:flex-start;
  display:inline-block; text-decoration:none;
  background:var(--encre); color:var(--parchemin);
  border:1px solid var(--encre);
  padding:.55rem 1.1rem; font-family:var(--police-titres); font-size:.95rem;
  letter-spacing:.03em;
  transition:background .2s ease, color .2s ease;
}
.bouton-achat:hover{ background:var(--rouge-sang); border-color:var(--rouge-sang); color:#fff; }

/* Liste de pistes de recherche (Leboncoin, etc.) */
.liste-references{
  list-style:none; margin:1rem 0 1.4rem; padding:0;
  display:flex; flex-direction:column; gap:.5rem;
}
.liste-references li{
  border:1px dashed var(--or-vieilli); padding:.6rem .9rem;
  font-style:italic; color:var(--texte-clair);
}
.prix-indicatif{
  color:var(--or-clair); font-style:normal; font-weight:600;
}
</style>
</head>

/* ============================================================================
   MOTEUR DE NAVIGATION
   ============================================================================ */

// Équivalent d'un html.escape() en Python : évite qu'un texte de contenu
// (y compris un placeholder du type "<REF_LEBONCOIN_1>") ne soit interprété
// comme une balise HTML lors de l'insertion dans la page.
function echapper(texte){
  return String(texte)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// "chemin" mémorise la suite des noeuds visités depuis la racine :
// chemin[0] est toujours la racine (accueil), le dernier élément est le
// noeud actuellement affiché. Naviguer = pousser/retirer des éléments.
let chemin = [arbreDecision];

const zoneContenu = document.getElementById("zone-contenu");
const filAriane = document.getElementById("fil-ariane");

function estFeuille(noeud){
  return !noeud.enfants || noeud.enfants.length === 0;
}

function construireFilAriane(){
  if (chemin.length < 2){ filAriane.innerHTML = ""; return; }
  let html = "";
  chemin.forEach((noeud, index) => {
    const estDernier = index === chemin.length - 1;
    if (index > 0) html += '<span class="separateur" aria-hidden="true">❖</span>';
    if (estDernier){
      html += `<span class="courant">${echapper(noeud.label)}</span>`;
    } else {
      html += `<button type="button" data-action="fil" data-index="${index}">${echapper(noeud.label)}</button>`;
    }
  });
  filAriane.innerHTML = html;
}

function construireBoutonAchat(produit){
  return `<a class="bouton-achat" href="${echapper(produit.lien)}" target="_blank" rel="noopener noreferrer">Se procurer</a>`;
}

function construireCarteProduit(produit){
  return `
    <article class="carte-produit">
      <img class="produit-image" data-src="images/${echapper(produit.image)}" alt="${echapper(produit.nom)}">
      <div class="contenu-carte">
        <h3>${echapper(produit.nom)}</h3>
        <p>${echapper(produit.description)}</p>
        ${produit.note ? `<p class="note-produit">${echapper(produit.note)}</p>` : ""}
        ${construireBoutonAchat(produit)}
      </div>
    </article>`;
}

// Transforme un texte d'intro en une suite de paragraphes et d'illustrations.
// Pour insérer une image au fil du texte, place son nom de fichier entre
// chevrons directement dans la chaîne : "... un texte ... <mon-image.jpg> ... la suite ...".
// Extensions reconnues : .png .jpg .jpeg .gif .webp .svg
function construireContenuTexte(texte){
  if (!texte) return "";
  // découpe la chaîne en alternant : texte, nom d'image, texte, nom d'image, ...
  const parties = String(texte).split(/<([^<>\s]+\.(?:png|jpe?g|gif|webp|svg))>/i);
  let html = "";
  parties.forEach((partie, index) => {
    const estUneImage = index % 2 === 1; // les indices impairs sont les noms d'images capturés
    if (estUneImage){
      html += `<figure class="illustration-intro">
        <img class="image-intro" data-src="images/${echapper(partie)}" alt="Illustration">
      </figure>`;
    } else {
      const texteNettoye = partie.trim();
      if (texteNettoye) html += `<p>${echapper(texteNettoye)}</p>`;
    }
  });
  return html;
}

function construireBranche(noeud){
  let html = `<h2 class="question-courante" tabindex="-1">${echapper(noeud.question)}</h2>`;
  if (noeud.intro) html += construireContenuTexte(noeud.intro);
  html += '<ul class="liste-choix">';
  noeud.enfants.forEach((enfant, index) => {
    html += `<li><button type="button" class="tuile-choix" data-action="avancer" data-index="${index}">${echapper(enfant.label)}</button></li>`;
  });
  html += "</ul>";
  return html;
}

function construireFeuille(noeud){
  let html = `<h2 class="question-courante" tabindex="-1">${echapper(noeud.label)}</h2>`;

  if (noeud.citation){
    html += `<blockquote class="citation-skaven">${echapper(noeud.citation.texte)}<cite>— ${echapper(noeud.citation.auteur)}</cite></blockquote>`;
  }
  if (noeud.intro){
    html += construireContenuTexte(noeud.intro);
  }
  if (noeud.clinOeil){
    html += `<p class="clin-oeil">${echapper(noeud.clinOeil)}</p>`;
  }
  if (noeud.produits && noeud.produits.length){
    const classeGrille = noeud.produits.length > 1 ? "grille-produits produits-multiples" : "grille-produits";
    html += `<div class="${classeGrille}">`;
    noeud.produits.forEach(p => { html += construireCarteProduit(p); });
    html += "</div>";
  }
  if (noeud.references && noeud.references.length){
    html += '<ul class="liste-references">';
    noeud.references.forEach(ref => {
      html += `<li>Piste de recherche : ${echapper(ref)}</li>`;
    });
    html += "</ul>";
  }
  if (noeud.lienRecherche){
    html += `<p><a class="bouton-achat" href="${echapper(noeud.lienRecherche.url)}" target="_blank" rel="noopener noreferrer">${echapper(noeud.lienRecherche.texte)}</a></p>`;
  }
  if (noeud.note){
    html += `<p class="note-aparte">${echapper(noeud.note)}</p>`;
  }
  return html;
}

// Remplace chaque image par son placeholder illustré si le fichier est introuvable
// (utile tant que tu n'as pas encore déposé tes propres visuels dans /images/).
function chargerImages(conteneur){
  conteneur.querySelectorAll("img[data-src]").forEach(img => {
    img.addEventListener("error", () => {
      img.classList.add("image-manquante");
      img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240">
           <rect width="100%" height="100%" fill="#171310"/>
           <text x="50%" y="50%" fill="#b8923f" font-family="serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Image à venir</text>
         </svg>`
      );
    }, { once:true });
    img.src = img.dataset.src;
  });
}

function rendre(){
  const noeud = chemin[chemin.length - 1];
  construireFilAriane();

  zoneContenu.classList.remove("apparition");
  void zoneContenu.offsetWidth; // force le navigateur à "oublier" l'animation précédente

  let html = estFeuille(noeud) ? construireFeuille(noeud) : construireBranche(noeud);

  if (chemin.length > 1){
    html += `<div><button type="button" class="bouton-retour" data-action="retour">‹ Retour</button></div>`;
  }

  zoneContenu.innerHTML = html;
  chargerImages(zoneContenu);
  zoneContenu.classList.add("apparition");

  const titre = zoneContenu.querySelector(".question-courante");
  if (titre) titre.focus();
}

// Un seul écouteur, posé sur la zone de contenu et le fil d'Ariane :
// on lit l'attribut data-action du bouton cliqué pour savoir quoi faire.
function gererClic(evenement){
  const bouton = evenement.target.closest("[data-action]");
  if (!bouton) return;
  const noeudCourant = chemin[chemin.length - 1];

  if (bouton.dataset.action === "avancer"){
    chemin.push(noeudCourant.enfants[Number(bouton.dataset.index)]);
  } else if (bouton.dataset.action === "retour"){
    if (chemin.length > 1) chemin.pop();
  } else if (bouton.dataset.action === "fil"){
    chemin = chemin.slice(0, Number(bouton.dataset.index) + 1);
  } else {
    return;
  }
  rendre();
}

zoneContenu.addEventListener("click", gererClic);
filAriane.addEventListener("click", gererClic);

// Premier affichage
rendre();
</script>
